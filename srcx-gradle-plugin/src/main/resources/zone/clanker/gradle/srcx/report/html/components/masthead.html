<header class="srcx-masthead {{classes}}">
    <div class="srcx-masthead__brand">
        <strong>{{brand}}</strong>
        <span>{{bureau}}</span>
    </div>
    <div class="srcx-masthead__folio">{{folio}}</div>
    <div class="srcx-status srcx-tone--{{tone}}">
        <i class="srcx-status__dot" aria-hidden="true"></i>
        {{state}}
    </div>
</header>
